x-airflow-common: &airflow-common
  image: shopbrasil-airflow:latest
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'shopbrasil-dev-secret-key'
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./include:/opt/airflow/include
    - ./tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-analytics:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  postgres-analytics:
    image: postgres:15
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:-analytics}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-shopbrasil}
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
      - ./include/sql/init_analytics.sql:/docker-entrypoint-initdb.d/init_analytics.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ANALYTICS_DB_USER:-analytics}", "-d", "${ANALYTICS_DB_NAME:-shopbrasil}"]
      interval: 5s
      retries: 5

  airflow-init:
    build: .
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Admin \
          --lastname ShopBrasil \
          --role Admin \
          --email admin@shopbrasil.com.br \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true
        airflow connections delete postgres_shopbrasil || true
        airflow connections add postgres_shopbrasil \
          --conn-type postgres \
          --conn-host postgres-analytics \
          --conn-schema "${ANALYTICS_DB_NAME:-shopbrasil}" \
          --conn-login "${ANALYTICS_DB_USER:-analytics}" \
          --conn-password "${ANALYTICS_DB_PASSWORD:-analytics}" \
          --conn-port 5432
        airflow pools set ecommerce_pool 2 "Controle de concorrencia das tasks de analise"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_airflow_data:
  postgres_analytics_data:
